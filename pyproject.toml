[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-governance"
version = "2.1.0"
description = "Constitutional governance layer for Claude Code: every edit is challenged, defended, ruled on, and hash-chained into a ledger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Dana Burks", email = "dburks@nuralyn.com" }]
# Mirrors requirements.txt exactly; tests/test_packaging.py fails if the two
# drift. The lock files remain the install path CI uses.
dependencies = ["anthropic==1.2.0"]

[project.urls]
Repository = "https://github.com/Nuralyn/Bench"

[project.scripts]
bench = "cli.__main__:run"

# Runtime resources ship as package data so a wheel install is complete: the
# core constitution beside the module that loads it, and the two hook scripts
# in the hooks package (pre-tool-use.py is a module file there and ships on
# its own). tests/test_packaging.py fails if any of the three goes missing.
[tool.setuptools]
packages = ["cli", "pipeline", "ledger", "utils", "hooks"]

[tool.setuptools.package-data]
pipeline = ["bench.json"]
hooks = ["pre-commit"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["graphify-out"]

[tool.mypy]
python_version = "3.11"
strict = true
# Source files are addressed by path, and the hook's filename is not an
# importable module name, so tell mypy where package roots are instead of
# letting it guess from the first file it sees.
explicit_package_bases = true
files = ["pipeline", "ledger", "utils", "cli", "hooks/pre-tool-use.py"]
# 192 annotations across 16 files still name a bare `dict`. Each site needs
# a C-004 judgment (`dict[str, Any]` for parsed JSON, `object` for values
# only stored or passed through), so they are tightened file by file under
# governance rather than mass-replaced. This is the one strictness flag the
# gate does not yet enforce; removing it is the follow-up.
disallow_any_generics = false

# openai is a soft dependency (utils/api.py imports it inside the OpenRouter
# path only) and is absent in CI. Its types resolve to Any there and to the
# real SDK types locally. Every other import must resolve.
[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true
