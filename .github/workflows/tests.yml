name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo. Without this block the
# job would inherit the repository default token scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Wheels only: refuse sdists so dependency setup.py scripts never
        # execute in CI. requirements.lock pins every resolved version,
        # transitives included, each verified against its sha256 hash.
        # The lock was added by recorded owner decision (commit 9eb1ade);
        # regenerate it per the note in requirements.txt.
        run: pip install --only-binary ':all:' --require-hashes -r requirements.lock
      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint-and-types:
    # ruff and mypy in strict mode over every source package and the hook.
    # The runtime lock is installed first so mypy checks against the same
    # anthropic SDK types the pipeline runs with; the lint lock adds only
    # the two checkers. Configuration lives in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --only-binary ':all:' --require-hashes -r requirements.lock
          pip install --only-binary ':all:' --require-hashes -r requirements-lint.lock
      - name: Lint
        run: ruff check .
      - name: Type check
        run: python -m mypy

  browser-tests:
    # tests/test_viewer_browser.py loads the generated ledger viewer in
    # headless Chromium. It skips itself when Playwright is absent, so the
    # matrix job above never runs it; this job installs the dev lock and
    # the browser, and BENCH_REQUIRE_BROWSER turns that skip into a failure
    # so a broken install cannot pass as a green run.
    runs-on: ubuntu-latest
    env:
      BENCH_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --only-binary ':all:' --require-hashes -r requirements.lock
          pip install --only-binary ':all:' --require-hashes -r requirements-dev.lock
      - name: Install Chromium
        # Playwright fetches the browser build pinned to its own version.
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m unittest tests.test_viewer_browser -v
