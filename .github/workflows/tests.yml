name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo. Without this block the
# job would inherit the repository default token scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Wheels only: refuse sdists so dependency setup.py scripts never
        # execute in CI. requirements.lock pins every resolved version,
        # transitives included, each verified against its sha256 hash.
        # The lock was added by recorded owner decision (commit 9eb1ade);
        # regenerate it per the note in requirements.txt.
        run: pip install --only-binary ':all:' --require-hashes -r requirements.lock
      - name: Run tests
        run: python -m unittest discover -s tests -v
